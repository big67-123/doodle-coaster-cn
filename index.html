<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#9fd4f2">
<title>涂鸦过山车 · 一笔画轨道 + 电磁弹射</title>
<meta name="description" content="随手画一条线，它就会变成一座过山车 —— 然后第一人称坐上去。支持 100–10000 km/h 电磁弹射、实时速度与 G 值仪表、自制轨道。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://big67-123.github.io/doodle-coaster-cn/">
<meta property="og:site_name" content="涂鸦过山车">
<meta property="og:title" content="涂鸦过山车 · Doodle Coaster CN">
<meta property="og:description" content="随手画一条线，它就会变成一座过山车 —— 然后第一人称坐上去。支持 100–10000 km/h 电磁弹射、实时速度与 G 值仪表、自制轨道。">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="涂鸦过山车 · Doodle Coaster CN">
<meta name="twitter:description" content="随手画一条线，它就会变成一座过山车 —— 然后第一人称坐上去。支持 100–10000 km/h 电磁弹射、实时速度与 G 值仪表、自制轨道。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 26 C8 26 9 6 16 6 C22 6 21 18 16 18 C11 18 12 10 18 10 C24 10 26 26 30 26' fill='none' stroke='%23d6342c' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--ink:#14202b;--red:#d6342c;--gold:#ffc53d;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd4f2;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--sans);color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font-family:inherit}

/* top bar */
#hud{position:fixed;left:0;right:0;top:0;z-index:8;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;pointer-events:none}
.brand{font:900 17px/1 var(--sans);letter-spacing:-.01em;display:flex;align-items:center;gap:7px;white-space:nowrap;margin-right:auto}
.brand i{display:inline-block;width:22px;height:14px;border-radius:7px;border:3px solid var(--red);border-bottom-color:transparent;transform:rotate(-12deg)}
.hb{pointer-events:auto;appearance:none;border:0;height:40px;min-width:40px;padding:0 13px;border-radius:20px;background:rgba(20,32,43,.82);color:#fff;font:800 14px/1 var(--sans);cursor:pointer;display:none}
#redraw{font-size:19px;padding:0}
body.hasTrack #redraw{display:block}
/* mini map button: only while riding in 3D */
/* view toggles (track, pillars, mini map): only while riding in 3D */
.tog{position:relative;padding:0;display:none !important;align-items:center;justify-content:center}
.tog svg{width:22px;height:22px;display:block}
body.pov3d .tog{display:flex !important}
.tog::after{content:'';position:absolute;left:9px;right:9px;top:50%;height:2.5px;margin-top:-1px;border-radius:2px;background:#ff7a6e;transform:rotate(-45deg);display:none}
body.mapOff #mapBtn,body.railsOff #railBtn,body.postsOff #postBtn{background:rgba(20,32,43,.45);color:rgba(255,255,255,.75)}
body.mapOff #mapBtn::after,body.railsOff #railBtn::after,body.postsOff #postBtn::after{display:block}
body.pov3d .brand{visibility:hidden}
/* mini map (the course from the side, with where you are now) */
#mini{position:fixed;inset:auto;left:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:8;display:none;width:auto;height:auto;border-radius:14px;background:rgba(255,255,255,.72);box-shadow:0 6px 20px rgba(0,30,60,.25);pointer-events:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
body.pov3d:not(.mapOff) #mini{display:block}
@media (max-width:440px){body.hasTrack .brand span{display:none}}
#gl{z-index:1;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s linear .7s}
body.pov3d #gl{opacity:1;visibility:visible;transition:opacity .7s ease}

/* start bar (after drawing) */
#startBar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);z-index:8;display:none;flex-direction:column;align-items:center;gap:10px;width:min(420px,calc(100vw - 24px))}
body.ready #startBar{display:flex}
#readyMsg{font:800 14px/1.3 var(--sans);background:rgba(255,255,255,.88);padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,40,80,.12);text-align:center}
#startBar .row2{display:flex;gap:10px;width:100%}
#startBar .btn{flex:1;padding:17px 10px;font-size:16px;box-shadow:0 6px 16px rgba(0,30,60,.15)}
#bGo{flex:1.7 !important;font-size:20px !important;letter-spacing:.04em;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.045);box-shadow:0 10px 26px rgba(214,52,44,.45)}}

/* start screen */
#hint{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:4;text-align:center;pointer-events:none;width:min(94vw,520px);transition:opacity .3s}
#hint.off{opacity:0}
#hint .h1{font:900 clamp(24px,6.6vw,40px)/1.15 var(--sans);letter-spacing:-.02em;text-shadow:0 2px 0 rgba(255,255,255,.6)}
#hint .sub{margin:12px 0 0;font:700 15px/1.5 var(--sans);opacity:.7}
#hint .pen{display:block;margin:14px auto 0;width:150px;height:56px}
#hint .pen path{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2.4s ease-in-out infinite}
@keyframes draw{60%,100%{stroke-dashoffset:0}}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translate(-50%,-8px);z-index:10;background:var(--ink);color:#fff;font:700 14px/1.4 var(--sans);padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;width:max-content;max-width:calc(100vw - 32px);text-align:center}
#toast.in{opacity:1;transform:translate(-50%,0)}

/* cards */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px 12px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(rgba(20,32,43,0) 40%,rgba(20,32,43,.35));overflow:auto;touch-action:pan-y}
.ov[hidden]{display:none}
.card{width:min(440px,100%);background:#fff;border-radius:22px;padding:18px 18px 14px;box-shadow:0 20px 60px rgba(0,30,60,.35);animation:up .45s cubic-bezier(.2,.9,.25,1.1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.kick{font:800 11.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin:4px 0 7px}
.name{font:900 25px/1.2 var(--sans);letter-spacing:-.02em;margin:0 0 16px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{appearance:none;border:0;border-radius:14px;padding:15px 10px;font:800 15px/1 var(--sans);cursor:pointer;background:#eef3f7;color:var(--ink);text-align:center;text-decoration:none;display:block}
.btn.pri{background:var(--ink);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.wide{grid-column:1/3}
.small{margin:12px 0 0;text-align:center;font-size:12px;opacity:.5;line-height:1.7}
.small a{color:inherit}
.ad-slot{margin-top:14px;display:flex;justify-content:center}
.ad-slot:empty{display:none}
@media (max-height:700px){.card{padding:14px 14px 12px}.name{font-size:22px;margin-bottom:12px}.btn{padding:13px 10px}.small{margin-top:8px}}

/* ---------- 仪表：速度 / G 值 ---------- */
#gauge{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%) translateY(14px);z-index:9;display:none;gap:9px;align-items:stretch;width:min(560px,calc(100vw - 20px));pointer-events:none;opacity:0;transition:opacity .35s ease,transform .35s ease}
body.riding #gauge{display:flex;opacity:1;transform:translateX(-50%) translateY(0)}
.gbox{flex:1 1 0;min-width:0;background:rgba(20,32,43,.82);border-radius:15px;padding:9px 12px 10px;color:#fff;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.glab{font:800 10px/1 var(--sans);letter-spacing:.15em;color:rgba(255,255,255,.6);text-transform:uppercase;white-space:nowrap}
.gval{display:flex;align-items:baseline;gap:4px;margin-top:4px}
.gnum{font:900 clamp(21px,6.6vw,32px)/1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gunit{font:800 11.5px/1 var(--sans);opacity:.7;white-space:nowrap}
.gbar{position:relative;height:5px;border-radius:3px;background:rgba(255,255,255,.15);margin-top:7px;overflow:hidden}
.gbar>i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:linear-gradient(90deg,#4cd07d,#ffc93c 52%,#ff5b4d)}
.gbar>u{position:absolute;top:-1px;bottom:-1px;left:0;width:2px;background:#fff;opacity:.9;border-radius:1px}
.gticks{display:flex;justify-content:space-between;margin-top:3px;font:700 8px/1 var(--sans);opacity:.42}
#gSlow{flex:0 0 auto;appearance:none;border:0;border-radius:15px;background:rgba(20,32,43,.82);color:#fff;font:800 10.5px/1 var(--sans);padding:0 11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;letter-spacing:.06em;pointer-events:auto;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
#gSlow b{font-size:15px;letter-spacing:0}
body.slowmo #gSlow{background:rgba(214,52,44,.92)}

/* ---------- 电磁弹射 ---------- */
#launchRow{width:100%;background:rgba(255,255,255,.9);border-radius:17px;padding:10px 13px 11px;box-shadow:0 4px 16px rgba(0,40,80,.13);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#launchRow .lhead{display:flex;align-items:baseline;gap:8px;font:800 12px/1 var(--sans);letter-spacing:.04em}
#launchRow .lhead span{font-weight:800;letter-spacing:.14em;opacity:.5;text-transform:uppercase;font-size:10px}
#launchRow .lhead b{margin-left:auto;font:900 17px/1 var(--sans);color:var(--red);font-variant-numeric:tabular-nums}
#launchRange{width:100%;margin:8px 0 0;height:24px;accent-color:var(--red);background:transparent}
#launchRow.off #launchRange,#launchRow.off .lpresets{opacity:.35;pointer-events:none}
.lpresets{display:flex;gap:6px;margin-top:3px}
.lpresets button{flex:1;appearance:none;border:0;border-radius:9px;background:#eef3f7;color:var(--ink);font:800 11px/1 var(--sans);padding:7px 0;cursor:pointer}
.lpresets button.on{background:var(--ink);color:#fff}
.ltoggle{display:flex;align-items:center;gap:7px;margin-top:9px;font:800 12px/1 var(--sans);opacity:.78}
.ltoggle input{width:17px;height:17px;accent-color:var(--red)}

/* ---------- 弹射闪光 / 高速速度线 ---------- */
#flash{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 62%,rgba(255,255,255,.98),rgba(150,215,255,.4) 46%,transparent 74%)}
#flash.go{animation:flashout .6s ease-out}
@keyframes flashout{0%{opacity:.95}100%{opacity:0}}
#lines{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .35s;background:repeating-linear-gradient(96deg,transparent 0 7px,rgba(255,255,255,.62) 7px 8px);-webkit-mask-image:radial-gradient(circle at 50% 50%,transparent 24%,#000 76%);mask-image:radial-gradient(circle at 50% 50%,transparent 24%,#000 76%)}
body.hyperspeed #lines{opacity:.5;animation:zoomlines .45s linear infinite}
@keyframes zoomlines{from{background-position:0 0}to{background-position:30px 0}}

/* ---------- 成绩卡 ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:0 0 12px}
.stat{background:#f2f6f9;border-radius:12px;padding:9px 11px;min-width:0}
.sk{font:800 10px/1 var(--sans);letter-spacing:.11em;color:rgba(20,32,43,.48);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv{font:900 18.5px/1.2 var(--sans);letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.sv small{font-size:10.5px;font-weight:800;opacity:.55;margin-left:2px}

/* ---------- 轨道工坊 ---------- */
#workshop .card{max-height:min(88vh,780px);display:flex;flex-direction:column}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex:0 0 auto}
.tabs button{flex:1;appearance:none;border:0;border-radius:11px;padding:10px 5px;font:800 12.5px/1 var(--sans);background:#eef3f7;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.pane{display:none;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.pane.on{display:block}
.tlist{display:flex;flex-direction:column;gap:8px}
.titem{display:flex;align-items:center;gap:9px;background:#f2f6f9;border-radius:13px;padding:10px 11px}
.titem .tt{flex:1;min-width:0}
.titem .tn{font:900 15px/1.25 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem .tm{font:700 11px/1.45 var(--sans);opacity:.55;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem button{flex:0 0 auto;appearance:none;border:0;border-radius:9px;padding:9px 11px;font:800 12px/1 var(--sans);background:var(--ink);color:#fff;cursor:pointer}
.titem button.ghost{background:#dfe7ee;color:var(--ink)}
#jsonBox{width:100%;height:180px;font:600 11.5px/1.55 ui-monospace,Consolas,"Courier New",monospace;border:1.5px solid #dbe4ec;border-radius:12px;padding:10px;resize:vertical;color:var(--ink);background:#fbfdff;box-sizing:border-box}
.vmsg{margin-top:9px;font:700 12px/1.6 var(--sans);border-radius:11px;padding:9px 11px;white-space:pre-wrap;display:none;word-break:break-word}
.vmsg.on{display:block}
.vmsg.ok{background:#e7f7ee;color:#186c43}
.vmsg.err{background:#fdeceb;color:#a9271f}
.vmsg.warn{background:#fff6e0;color:#8a5a00}
.rowbtn{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.rowbtn button{flex:1 1 auto;appearance:none;border:0;border-radius:11px;padding:11px 12px;font:800 12.5px/1 var(--sans);background:#eef3f7;color:var(--ink);cursor:pointer;white-space:nowrap}
.rowbtn button.pri{background:var(--red);color:#fff}
.rowbtn button.dark{background:var(--ink);color:#fff}
.hintline{font:700 11.5px/1.7 var(--sans);opacity:.55;margin:10px 0 0}

/* ---------- 编辑器 ---------- */
#editBar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);z-index:12;display:none;gap:7px;background:rgba(20,32,43,.9);padding:9px;border-radius:17px;width:min(560px,calc(100vw - 20px));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
body.editing #editBar{display:flex}
#editBar button{flex:1;appearance:none;border:0;border-radius:11px;padding:12px 4px;font:800 12.5px/1 var(--sans);background:rgba(255,255,255,.15);color:#fff;cursor:pointer;white-space:nowrap}
#editBar button.pri{background:var(--red)}
#editBar button.dark{background:#eef3f7;color:var(--ink)}
#editInfo{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 58px);transform:translateX(-50%);z-index:12;display:none;background:rgba(20,32,43,.84);color:#fff;font:800 11.5px/1.6 var(--sans);padding:8px 13px;border-radius:11px;text-align:center;white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
body.editing #editInfo{display:block}
#shopBtn{display:block !important}
body.pov3d #shopBtn,body.editing #shopBtn{display:none !important}
body.editing #hud{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="gl"></canvas>
<canvas id="mini"></canvas>

<div id="hud">
  <div class="brand"><i></i><span id="brandT">Doodle Coaster</span></div>
  <button class="hb tog" id="railBtn" type="button" aria-label="Track"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v18M16 3v18M8 7.5h8M8 12h8M8 16.5h8"/></svg></button>
  <button class="hb tog" id="postBtn" type="button" aria-label="Pillars"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7c5-4 13-4 18 0M7.5 5.2V20M16.5 5.2V20M4 20.5h16"/></svg></button>
  <button class="hb tog" id="mapBtn" type="button" aria-label="Mini map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 6.5l5.5-2.5 7 2.5L21 4v13.5L15.5 20l-7-2.5L3 20z"/><path d="M8.5 4v13.5M15.5 6.5V20"/></svg></button>
  <button class="hb" id="redraw" type="button" aria-label="Redraw">↺</button>
  <button class="hb" id="shopBtn" type="button" aria-label="Track workshop">🛠</button>
</div>

<div id="startBar">
  <div id="readyMsg"></div>
  <div id="launchRow">
    <div class="lhead"><span id="lLab"></span><b id="lVal">—</b></div>
    <input id="launchRange" type="range" min="0" max="1000" value="612" step="1">
    <div class="lpresets" id="lPresets"></div>
    <label class="ltoggle"><input id="noLaunch" type="checkbox"><span id="nlLab"></span></label>
  </div>
  <div class="row2"><button class="btn" id="bRedo" type="button"></button><button class="btn red" id="bGo" type="button"></button></div>
</div>

<div id="hint">
  <div class="h1" id="h1"></div>
  <p class="sub" id="sub"></p>
  <svg class="pen" viewBox="0 0 150 60"><path d="M5 50 C25 50 30 8 52 8 C72 8 66 38 54 38 C40 38 46 16 66 16 C86 16 92 50 108 50 C122 50 128 28 145 28" fill="none" stroke="#d6342c" stroke-width="4" stroke-linecap="round"/></svg>
</div>
<div id="toast"></div>

<div id="gauge">
  <div class="gbox">
    <div class="glab" id="gSpeedLab"></div>
    <div class="gval"><span class="gnum" id="gSpeed">0</span><span class="gunit">km/h</span></div>
  </div>
  <div class="gbox">
    <div class="glab" id="gGLab"></div>
    <div class="gval"><span class="gnum" id="gG">1.0</span><span class="gunit">G</span></div>
    <div class="gbar"><i id="gFill"></i><u id="gPeak"></u></div>
    <div class="gticks"><span>1</span><span>10</span><span>100</span><span>1k</span><span>10k</span></div>
  </div>
  <button id="gSlow" type="button"><b id="gSlowIcon">▶</b><span id="gSlowLab"></span></button>
</div>

<div id="flash"></div>
<div id="lines"></div>

<div id="editInfo"></div>
<div id="editBar">
  <button id="eUndo" type="button"></button>
  <button id="eClear" type="button"></button>
  <button id="eDone" class="pri" type="button"></button>
  <button id="eCancel" class="dark" type="button"></button>
</div>

<div class="ov" id="sharedOv" hidden>
  <div class="card">
    <p class="kick" id="sKick"></p><h2 class="name" id="sName"></h2>
    <div class="btns"><button class="btn red wide" id="sPov" type="button"></button><button class="btn wide" id="sDraw" type="button"></button></div>
  </div>
</div>

<div class="ov" id="result" hidden>
  <div class="card" id="rCard">
    <p class="kick" id="rKick"></p><h2 class="name" id="rName"></h2>
    <div class="stats" id="rStats"></div>
    <div class="btns">
      <a class="btn red wide" id="rShare" target="_blank" rel="noopener"></a>
      <button class="btn pri" id="rAgain" type="button"></button>
      <button class="btn" id="rNew" type="button"></button>
      <button class="btn" id="rShop" type="button"></button>
      <button class="btn" id="rSave" type="button"></button>
    </div>
    <div class="ad-slot" id="ad-slot"></div>
    <p class="small" id="credit"></p>
  </div>
</div>

<div class="ov" id="workshop" hidden>
  <div class="card">
    <p class="kick" id="wKick"></p><h2 class="name" id="wName"></h2>
    <div class="tabs" id="wTabs">
      <button type="button" data-pane="list"></button>
      <button type="button" data-pane="json"></button>
      <button type="button" data-pane="edit"></button>
    </div>
    <div class="pane on" data-pane="list">
      <div class="tlist" id="trackList"></div>
      <p class="hintline" id="listHint"></p>
    </div>
    <div class="pane" data-pane="json">
      <textarea id="jsonBox" spellcheck="false"></textarea>
      <div class="vmsg" id="vMsg"></div>
      <div class="rowbtn">
        <button id="wCheck" type="button"></button>
        <button id="wRide" class="pri" type="button"></button>
        <button id="wImport" type="button"></button>
      </div>
      <div class="rowbtn">
        <button id="wExport" type="button"></button>
        <button id="wCopy" type="button"></button>
      </div>
      <input id="wFile" type="file" accept=".json,application/json" hidden>
      <p class="hintline" id="jsonHint"></p>
    </div>

const toScreen = (x, y) => [x * view.s + view.ox, y * view.s + view.oy];
const toWorld = e => ({ x: (e.clientX - view.ox) / view.s, y: (e.clientY - view.oy) / view.s });

// resample a polyline every `step` metres

// gaussian blur of a list of numbers (sigma in samples, edges held)

// smooth the hand-drawn stroke and resample it every metre — these become the shareable control points.
// We smooth the direction of travel rather than the positions: finger wobble melts away,
// yet a loop stays a loop of the same size. A slow correction then keeps the shape where it was drawn.



/* ---------- share code: first point + per-metre deltas in centimetres (int8), ground as int16 ----------
   (links made by the first version used decimetres and the key "c=", new ones use "t=") */
const UNIT = 100;
function encode(c, gY) {
  const q = c.map(p => [Math.round(p.x * UNIT), Math.round(p.y * UNIT)]);
  const bytes = new Uint8Array(2 + (q.length - 1) * 2);
  const gr = Math.max(-32768, Math.min(32767, Math.round(gY * UNIT) - q[0][1]));
  bytes[0] = (gr >> 8) & 255; bytes[1] = gr & 255;
  for (let i = 1; i < q.length; i++) {
    bytes[2 + (i - 1) * 2] = Math.max(-127, Math.min(127, q[i][0] - q[i - 1][0])) & 255;
    bytes[3 + (i - 1) * 2] = Math.max(-127, Math.min(127, q[i][1] - q[i - 1][1])) & 255;
  }
  let s = ''; bytes.forEach(b => s += String.fromCharCode(b));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decode(str, unit) {
  const b = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
  const by = Uint8Array.from(b, ch => ch.charCodeAt(0));
  if (by.length < 8) throw new Error('short');
  let gr = (by[0] << 8) | by[1]; if (gr > 32767) gr -= 65536;
  const pts = [{ x: 0, y: 0 }]; let x = 0, y = 0;
  for (let i = 2; i + 1 < by.length; i += 2) {
    const dx = by[i] > 127 ? by[i] - 256 : by[i], dy = by[i + 1] > 127 ? by[i + 1] - 256 : by[i + 1];
    x += dx; y += dy; pts.push({ x: x / unit, y: y / unit });
  }
  return { pts, ground: gr / unit };
}
// the drawer and anyone opening the link ride exactly the same decoded track
function loadCode(c, shared, unit = UNIT, origin = null) {
  const { pts, ground } = decode(c, unit);
  if (shared) { ctrl = pts; groundY = ground; }
  else {
    const o = origin || raw[0];                    // keep the drawer's own screen position
    const q0 = [Math.round(o.x * unit) / unit, Math.round(o.y * unit) / unit];
    ctrl = pts.map(p => ({ x: p.x + q0[0], y: p.y + q0[1] }));
    groundY = ground + q0[1];
  }
  track = buildTrack(ctrl); buildExt(track); buildDepth(track); invalidateTrack();
  if (shared) fitView();
}

/* ---------- track: Catmull-Rom through the control points, resampled every 25 cm ---------- */


function fitView() {
  let minX = Infinity, maxX = -Infinity, minY = Infinity;
  for (const p of ctrl) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); }
  if (track && track.extB) {                    // room for the train waiting in the station
    const e = track.extB, j = Math.min(e.xs.length - 1, 40);
    minX = Math.min(minX, e.xs[j] + 2); maxX = Math.max(maxX, e.xs[j] - 2); minY = Math.min(minY, e.ys[j]);
  }
  minY -= 5; minX -= 4; maxX += 6;
  const top = 76, bottom = H - GROUND_PX;
  // 下限放到 0.1：世界尺度变大后手机上一屏就有 200 米，长轨道不该再被"最小 2 px/m"顶出屏幕。
  const s = Math.max(.1, Math.min(16, Math.min((W - 24) / (maxX - minX), (bottom - top) / (groundY - minY))));
  view = { s, ox: W / 2 - s * (minX + maxX) / 2, oy: bottom - s * groundY };
  fitted = true;
}

/* ---------- ride (fixed time step, so a shared link always rides exactly the same) ---------- */


const HOLD = 2.2;                                    // seconds in the station before the train leaves


/* ---------- ride flow ---------- */
function startRide() {
  if (baseView && !fitted) { view = { ...baseView }; buildBackdrop(); }
  else if (fitted) { fitView(); buildBackdrop(); }
  ride = newRide(); ride.hold = HOLD;
  const kmh = noLaunch ? 0 : launchKmh;

  // 先无头跑一遍拿到真实车程，再按目标观感时长反推慢动作系数（见「慢动作」一节）
  // 步长用 1/40 而不是渲染用的 1/240：>60 m/s 后自适应用的是空间步长，帧长对时长几乎无影响，
  // 但粗 6 倍能把这瞬间的阻塞从 ~0.4 秒压到 ~0.1 秒。
  rideSimT = Math.max(.02, simulate(ctrl, { launchKmh: kmh, dt: 1 / 40 }).t);
  slowFactorNow = 1;
  retargetSlow(0);
  gauge.s = gauge.g = gauge.peak = null;
  mode = 'ride';
  setView3d(true);                                   // the ride itself is first person; the side view is the mini map
  const rr = ride; setTimeout(() => { if (ride === rr && mode === 'ride') chime(); }, 450);
  document.body.classList.add('riding', 'hasTrack');
  document.body.classList.remove('ready', 'editing');

}
function finishRide() {

}
function showResult() {
  document.body.classList.remove('riding', 'hyperspeed');

  $('#rKick').textContent = L.kick;
  $('#rName').textContent = L.done;
  const r = ride, K = v => Math.round(v * 3.6).toLocaleString('zh-CN');

  if (r && r.launchA > 0) { const a = r.launchA / G; rows.push([L.launchA, a >= 100 ? a.toFixed(0) : a.toFixed(1), 'G']); }
  if (r) rows.push(
    [L.maxSpeed, K(r.vmax), 'km/h'],
    [L.maxG, fmtG(r.gAbsMax), 'G'],
    [L.duration, r.t.toFixed(r.t >= 20 ? 1 : 2), 's'],
    [L.entrySpeed, K(r.v), 'km/h'],
  );
  $('#rStats').innerHTML = rows.map(x => `<div class="stat"><div class="sk">${x[0]}</div><div class="sv">${x[1]}<small>${x[2]}</small></div></div>`).join('');

  $('#rShare').href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(L.tweet)}&url=${encodeURIComponent(url)}&hashtags=${encodeURIComponent(L.tag)}`;
  $('#rShare').textContent = L.share;
  $('#rAgain').textContent = L.again; $('#rNew').textContent = L.fresh; $('#rSave').textContent = L.save;
  $('#rShop').textContent = L.workshop;
  $('#credit').innerHTML = `${L.brand} · 中文版 + 电磁弹射 / 仪表 / 轨道工坊<br>原作 <a href="https://rakugaki-coaster.pages.dev/" target="_blank" rel="noopener">らくがきコースター</a> by <a href="https://x.com/kikuchitls" target="_blank" rel="noopener">@kikuchitls</a><br><a href="?lang=zh">中文</a> · <a href="?lang=en">English</a>`;

/* ---------- audio ---------- */
let AC = null, windG = null, windF = null;
function audioInit() {
  try {
    if (!AC) {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      AC = new C();
      const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      windF = AC.createBiquadFilter(); windF.type = 'lowpass'; windF.frequency.value = 400;
      windG = AC.createGain(); windG.gain.value = 0;
      src.connect(windF); windF.connect(windG); windG.connect(AC.destination); src.start();
    }
    if (AC.state !== 'running') {
      AC.resume().catch(() => {});
      const b = AC.createBuffer(1, 1, 22050), src = AC.createBufferSource(); src.buffer = b; src.connect(AC.destination); src.start(0);
    }
  } catch (e) {}
}
['pointerup', 'touchend', 'click', 'keydown'].forEach(ev => addEventListener(ev, audioInit, { passive: true, capture: true }));
function windSound(v) {
  if (!AC) return;
  const a = Math.min(1, v / 35), t = AC.currentTime;
  windG.gain.setTargetAtTime(a * a * .28, t, .08);
  windF.frequency.setTargetAtTime(300 + a * 1600, t, .08);
}
function click() {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = 'square'; o.frequency.value = 900;
  g.gain.setValueAtTime(.05, t); g.gain.exponentialRampToValueAtTime(.0001, t + .03);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + .04);
}
function chime() {                                    // two soft notes: the train is about to leave
  if (!AC) return;
  const t = AC.currentTime;
  [[659.3, 0], [523.3, .42]].forEach(([f, d]) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t + d); g.gain.exponentialRampToValueAtTime(.16, t + d + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d + 1.1);
    o.connect(g); g.connect(AC.destination); o.start(t + d); o.stop(t + d + 1.15);

  const fill = (gLog(r.g) * 100).toFixed(1) + '%';
  if (fill !== gauge.fill) { gauge.fill = fill; $('#gFill').style.width = fill; }
  const peak = (gLog(r.gAbsMax) * 100).toFixed(1) + '%';

/* ---------- 弹射音效 + 闪光 ---------- */
function launchSound(v) {
  if (!AC) return;
  const t0 = AC.currentTime, dur = Math.min(1.8, Math.max(.4, v / 800));
  const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(60, t0);
  o.frequency.exponentialRampToValueAtTime(60 + Math.min(2800, 40 + v * 1.5), t0 + dur);
  f.type = 'lowpass';
  f.frequency.setValueAtTime(500, t0);
  f.frequency.exponentialRampToValueAtTime(5200, t0 + dur);
  g.gain.setValueAtTime(.0001, t0);
  g.gain.exponentialRampToValueAtTime(.2, t0 + dur * .85);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur + .25);
  o.connect(f); f.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + .3);
  const len = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(i / len, 3) * .45;
  const src = AC.createBufferSource(); src.buffer = buf;
  const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2200;
  const hg = AC.createGain(); hg.gain.value = .09;
  src.connect(hp); hp.connect(hg); hg.connect(AC.destination); src.start(t0);
}
function launchFx(kmh) {
  const f = $('#flash');
  f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  launchSound(kmh / 3.6);
  toast(L.launchToast.replace('{v}', kmh.toLocaleString('zh-CN') + ' km/h'));
}
// 站台放行的音效留在页面这一侧；装了弹射就改成 LSM 的啸叫。
onRelease(r => {
  if (r !== ride || mode !== 'ride') return;
  if (r.launching) launchFx(Math.round(r.launchV * 3.6)); else release();
});

resize();

function showSharedOverlay() {
  mode = 'shared'; ride = newRide(); prepare3D(); $('#hint').classList.add('off');
  document.body.classList.add('hasTrack'); document.body.classList.remove('ready', 'riding', 'editing');
  $('#sKick').textContent = L.sKick; $('#sName').textContent = L.sName;
  $('#sDraw').textContent = L.sDraw; $('#sPov').textContent = L.ride;
  $('#sharedOv').hidden = false;
}
// 分享链接：原作是 #t=/#c=（字节编码，仍然完全兼容）；自己设计的轨道用 #j=（JSON）。
const mj = location.hash.match(/(?:^#|&)j=([A-Za-z0-9_-]+)/);
const mc = location.hash.match(/(?:^#|&)([ct])=([A-Za-z0-9_-]+)/);
if (mj) {
  try {
    const v = loadDef(JSON.parse(b64uDecode(mj[1])), true);
    if (v.ok) showSharedOverlay(); else { toast(v.errors[0].msg); resetDraw(); }
  } catch (e) { resetDraw(); }
} else if (mc) {
  try {
    codeKey = mc[1]; code = mc[2]; loadCode(code, true, codeKey === 'c' ? 10 : UNIT); baseView = Object.assign({}, view); buildBackdrop();
    showSharedOverlay();
  } catch (e) { resetDraw(); }
}
requestAnimationFrame(frame);

/* ---------- ?test=1 的无头验证钩子 ---------- */
if (QP.get('test') === '1') window.__olc = {
  get phys() { return P; },
  sample: s => sample(track, s),
  get view3d() { return view3d; }, get ride() { return ride; }, get mode() { return mode; },
  get code() { return code; }, get track() { return track; }, get ctrl() { return ctrl; },
  get groundY() { return groundY; }, get view() { return view; }, get lang() { return LANG; },
  get launchKmh() { return noLaunch ? 0 : launchKmh; },
  get slowmo() { return slowFactor(); },
  get editing() { return editing; },
  get editPts() { return editPts.map(p => ({ x: p.x, y: p.y })); },
  get bodyClass() { return document.body.className; },
  dry: opts => simulate(ctrl, Object.assign({ dt: .05 }, opts || {})),
  stats: () => ride ? { v: ride.v, vmax: ride.vmax, gAbsMax: ride.gAbsMax, t: ride.t, launchA: ride.launchA, launchV: ride.launchV, ended: ride.ended, faulted: ride.faulted } : null,
  setArcade: on => setArcade(on !== false),
  setLaunch: kmh => { launchKmh = Math.max(LAUNCH_MIN, Math.min(LAUNCH_MAX, kmh)); noLaunch = false; syncLaunchUI(); },
  setNoLaunch: on => { noLaunch = !!on; syncLaunchUI(); },
  loadDef: (d, shared) => loadDef(d, shared),
  openWorkshop, closeWorkshop, setTab, renderTrackList,
  enterEdit: d => enterEdit(d), exitEdit: a => exitEdit(a),
  editMove: (i, x, y) => { editPts[i] = { x, y }; rebuildEdit(true); updateEditInfo(); },
  editAdd: (x, y) => { const at = nearestInsert({ x, y }); editPts.splice(at, 0, { x, y }); rebuildEdit(true); updateEditInfo(); return at; },
  editDelete: i => deleteHandle(i),
  editUndo: () => { if (editUndo.length) { editPts = editUndo.pop(); rebuildEdit(true); updateEditInfo(); return true; } return false; },
  get slowTarget() { return slowTarget(); }, get rideSimT() { return rideSimT; },
  setSlowTarget: i => { slowTargetIdx = Math.max(0, Math.min(SLOW_TARGETS.length - 1, i | 0)); store.set('slowTarget', slowTargetIdx); retargetSlow(0); return slowTargetIdx; },
  setSlowFactor: f => { slowFactorNow = Math.max(.01, Number(f) || 1); updateSlowUI(); return slowFactorNow; },
  cycleSlow, shareHash, exportDef,
  sessionDefs: () => sessionDefs.slice(),
  builtinDefs: () => builtinDefs.slice(),
  ready: () => { if (track) { baseView = Object.assign({}, view); enterReady(); } return mode; },
};
})();

</script>
</body>
</html>
